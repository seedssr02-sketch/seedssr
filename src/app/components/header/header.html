<header class="site-header">
  <div class="top-bar">
    <div class="container top-bar-inner">
      <span>🌱 Frete discreto para todo o Brasil — finalize no WhatsApp</span>
    </div>
  </div>

  <div class="container header-main">
    <button class="icon-btn mobile-toggle" (click)="toggleMobile()" aria-label="Menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <a routerLink="/" class="logo" (click)="closeMobile()">
      <img class="logo-mark" src="logo/img-ss.jpeg" alt="Señores Seeds Bank" width="44" height="44" />
      <span class="logo-text">
        <strong>Señores</strong>
        <small>SEEDS BANK</small>
      </span>
    </a>

    <nav class="primary-nav">
      <ng-container *ngFor="let item of menu; trackBy: trackByLabel">
        <ng-container *ngIf="item.children?.length; else singleLink">
          <div class="nav-dropdown" [class.open]="seedsOpen()">
            <button type="button" class="nav-link dropdown-toggle" (click)="toggleSeedsMenu()" [attr.aria-expanded]="seedsOpen()">
              {{ item.label }}
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9l6 6 6-6" />
              </svg>
            </button>
            <div class="dropdown-menu">
              <a *ngFor="let child of item.children; trackBy: trackByLabel" [routerLink]="child.link" routerLinkActive="active" (click)="closeMobile()">{{ child.label }}</a>
            </div>
          </div>
        </ng-container>
        <ng-template #singleLink>
          <a [routerLink]="item.link" routerLinkActive="active" class="nav-link">{{ item.label }}</a>
        </ng-template>
      </ng-container>
    </nav>

    <div class="header-actions">
      <button class="icon-btn" (click)="toggleSearch()" aria-label="Buscar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <button class="icon-btn cart-btn" (click)="openCart()" aria-label="Carrinho">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"/>
          <circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>
        </svg>
        @if (cart.count() > 0) {
          <span class="cart-badge">{{ cart.count() }}</span>
        }
      </button>
    </div>
  </div>

  @if (searchOpen()) {
    <div class="search-bar">
      <div class="container">
        <form (submit)="submitSearch($event)">
          <input
            type="search"
            placeholder="Buscar sementes, genéticas..."
            [value]="searchQuery()"
            (input)="searchQuery.set($any($event.target).value)"
            autofocus
          />
          <button type="submit" class="btn btn-primary">Buscar</button>
        </form>
      </div>
    </div>
  }

  <ng-container *ngIf="mobileOpen()">
    <nav class="mobile-nav">
      <ng-container *ngFor="let item of menu; trackBy: trackByLabel">
        <ng-container *ngIf="item.children?.length; else mobileSingle">
          <button type="button" class="mobile-submenu-toggle" (click)="toggleSeedsMenu()">
            {{ item.label }}
          </button>
          <div class="mobile-submenu" *ngIf="seedsOpen()">
            <a *ngFor="let child of item.children; trackBy: trackByLabel" [routerLink]="child.link" (click)="closeMobile()">{{ child.label }}</a>
          </div>
        </ng-container>
        <ng-template #mobileSingle>
          <a [routerLink]="item.link" (click)="closeMobile()">{{ item.label }}</a>
        </ng-template>
      </ng-container>
    </nav>
  </ng-container>
</header>
