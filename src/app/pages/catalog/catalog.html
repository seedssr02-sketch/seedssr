<section class="page-header">
  <div class="container">
    <div class="breadcrumb-wrap">
      <nav class="breadcrumb">
        <a routerLink="/">Início</a>
        <span>/</span>
        <span>{{ currentTitle() }}</span>
      </nav>
      <div class="breadcrumb-divider"></div>
    </div>
    <h1>{{ currentTitle() }}</h1>
    <p class="category-description" *ngIf="currentDescription()">{{ currentDescription() }}</p>
    <p class="search-info" *ngIf="searchTerm()">Resultados para: <strong>"{{ searchTerm() }}"</strong></p>
  </div>
</section>

<section class="catalog">
  <div class="container catalog-grid">
    <aside class="filters">
      <h3>Categorias</h3>
      <ul>
        <li *ngFor="let cat of categories; trackBy: trackByCategory">
          <a
            href=""
            [routerLink]="cat.slug === 'todas' ? '/catalogo' : ['/catalogo', cat.slug]"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="navigateCategory($event, cat)"
          >
            {{ cat.name }}
          </a>
        </li>
      </ul>
    </aside>

    <div class="results">
      <div class="results-bar">
        <span>{{ products().length }} produto(s)</span>
        <label>
          Ordenar:
          <select [value]="sort()" (change)="setSort($event)">
            <option value="destaque">Destaque</option>
            <option value="preco-asc">Menor preço</option>
            <option value="preco-desc">Maior preço</option>
            <option value="nome">Nome (A-Z)</option>
          </select>
        </label>
      </div>

      <ng-container *ngIf="products().length === 0; else productList">
        <div class="empty">
          <p>Nenhum produto encontrado.</p>
          <a routerLink="/catalogo" class="btn btn-outline">Ver tudo</a>
        </div>
      </ng-container>
      <ng-template #productList>
        <div class="product-grid" id="product-list">
          <app-product-card *ngFor="let p of products(); trackBy: trackByProduct" [product]="p"></app-product-card>
        </div>
      </ng-template>
    </div>
  </div>
</section>
